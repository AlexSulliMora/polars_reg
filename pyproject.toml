[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars_reg"
version = "0.1.0"
description = "Econometric regression methods using Polars DataFrames"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
