[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars_reg"
version = "0.1.0"
description = "Econometric regression methods using Polars DataFrames"
readme = "README.md"
license = "MIT"
authors = [{name = "Alex Sullivan Mora"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "polars>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "pdoc>=14.0",
]

[project.urls]
Homepage = "https://github.com/AlexSulliMora/polars_reg"
Repository = "https://github.com/AlexSulliMora/polars_reg"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "polars_reg._native"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
# NDArray[np.floating[Any]] everywhere is not worth the verbosity
disable_error_code = ["type-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
